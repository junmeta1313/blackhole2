name: Daily Space Briefing

on:
  schedule:
    # UTC 00:17 = 09:17 KST, once per day.
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-space-briefing.py
      - .github/workflows/space-briefing.yml

permissions:
  contents: write

concurrency:
  group: repository-content-updates
  cancel-in-progress: false

jobs:
  update-space-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test feed selection and daily limits
        run: python -m unittest discover -s scripts -p 'test_space_briefing.py'

      - name: Verify official feeds without AI charges
        if: github.event_name == 'push'
        run: python scripts/update-space-briefing.py --dry-run

      - name: 우주 기사/논문 2건 생성
        run: python scripts/update-space-briefing.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: 변경사항 커밋
        run: |
          git config user.name "Event Horizon Space Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/space-briefing.json
          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "chore: publish daily space briefing"
          git pull --rebase origin main
          git push

