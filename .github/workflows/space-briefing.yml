name: Hourly Space Briefing

on:
  schedule:
    # 매시간 17분, 한국 시간 기준. 정각 혼잡을 피하기 위해 17분으로 설정.
    - cron: "17 * * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-space-briefing
  cancel-in-progress: false

jobs:
  update-space-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 우주 기사/논문 2건 생성
        run: node scripts/update-space-briefing.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: 변경사항 커밋
        run: |
          git config user.name "Event Horizon Space Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/space-briefing.json
          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "chore: update hourly space briefing"
          git push
