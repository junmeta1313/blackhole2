name: Automatic Space Galleries

on:
  schedule:
    # NASA: KST 00:37, 06:37, 12:37, 18:37.
    - cron: '37 3,9,15,21 * * *'
    # Creative: KST 00:37, 04:37, 08:37, 12:37, 16:37, 20:37.
    - cron: '37 3,7,11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'New images: all/photos/creative. Missing stories only: descriptions. AI calls incur costs.'
        type: choice
        options: [all, photos, creative, descriptions]
        default: all
  push:
    branches: [main]
    paths:
      - scripts/cosmic-generator.mjs
      - scripts/cosmic-generator.test.mjs
      - scripts/cosmic-options.json
      - scripts/update-galleries.mjs
      - scripts/update-galleries.test.mjs
      - scripts/describe-creations.mjs
      - scripts/describe-creations.test.mjs
      - assets/cosmic-scenes.js
      - .github/workflows/galleries.yml

permissions:
  contents: write

concurrency:
  group: repository-content-updates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test gallery periods and fiction
        run: node --test scripts/cosmic-generator.test.mjs scripts/update-galleries.test.mjs scripts/describe-creations.test.mjs
      - name: Six-hour NASA photo
        id: photos
        if: github.event_name == 'push' || github.event.schedule == '37 3,9,15,21 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'photos'))
        continue-on-error: true
        run: node scripts/update-galleries.mjs photos ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Four-hour AI creation
        id: creative
        if: github.event_name == 'push' || github.event.schedule == '37 3,7,11,15,19,23 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'creative'))
        continue-on-error: true
        run: node scripts/update-galleries.mjs creative ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Write original stories from actual images
        id: descriptions
        if: always() && (github.event_name == 'push' || github.event.schedule == '37 3,7,11,15,19,23 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'photos'))
        continue-on-error: true
        run: node scripts/describe-creations.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Commit available posts
        if: always()
        run: |
          git config user.name "Event Horizon Gallery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo-gallery.json data/creative-gallery.json
          if [ -d assets/creative ]; then git add assets/creative; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish automatic space galleries"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report API failures
        if: steps.photos.outcome == 'failure' || steps.creative.outcome == 'failure' || steps.descriptions.outcome == 'failure'
        run: exit 1
